kind: ConfigMap
apiVersion: v1
metadata:
  name: collector-configmap
  namespace: {{ .Release.Namespace }}
data:
  config.hocon: |
    collector {
      interface = "0.0.0.0"
      port = 8080
      ssl {
        enable = false
        redirect = false
        port = 8443
      }
      paths {
      {{- range $key, $value := .Values.collector.customPaths }}
        "{{ $key }}" = "{{ $value }}"
      {{- end }}
      }
      p3p {
        policyRef = "/w3c/p3p.xml"
        CP = "NOI DSP COR NID PSA OUR IND COM NAV STA"
      }
      crossDomain {
        enabled = false
        domains = [ "*" ]
        secure = true
      }
      cookie {
        enabled = true
        expiration = "365 days"
        name = sp
        domains = []
        fallbackDomain = ""
        secure = true
        httpOnly = false
        sameSite = "None"
      }
      doNotTrackCookie {
        enabled = false
        name = ""
        value = ""
      }
      cookieBounce {
        enabled = false
        name = "n3pc"
        fallbackNetworkUserId = "00000000-0000-4000-A000-000000000000"
        forwardedProtocolHeader = "X-Forwarded-Proto"
      }
      enableDefaultRedirect = false
      redirectMacro {
        enabled = false
        placeholder = "[TOKEN]"
      }
      rootResponse {
        enabled = false
        statusCode = 302
        headers = {}
        body = "302, redirecting"
      }
      cors {
        accessControlMaxAge = "5 seconds"
      }
      streams {
        good = {{ .Values.collector.kafka.goodTopicName }}
        bad = {{ .Values.collector.kafka.badTopicName }}
        sink {
          host  = {{ .Values.collector.kafka.bootstrapServiceName }}
          port = {{ .Values.collector.kafka.bootstrapServicePort }} 
          brokers = "{{ .Values.collector.kafka.bootstrapServiceName }}:{{ .Values.collector.kafka.bootstrapServicePort }}"
          backoffPolicy {
            minBackoff = 1000
            maxBackoff = 1000
            totalBackoff = 10000
            multiplier = 1
          }
        }
        buffer {
          byteLimit = 1000000
          recordLimit = 500
          timeLimit = 500
        }
      }
      telemetry {
        disable = true
        url = "telemetry-g.snowplowanalytics.com"
        userProvidedId = ""
        moduleName = "collector-pubsub-ce"
        moduleVersion = "0.2.2"
        autoGeneratedId = "329042380932sdjfiosdfo"
      }
      monitoring.metrics.statsd {
        enabled = {{ .Values.collector.statsd.enabled }}
        # StatsD metric reporting protocol configuration
        hostname = {{ .Values.collector.statsd.hostname }}
        port = {{ .Values.collector.statsd.port }}
        # Required, how frequently to report metrics
        period = "10 seconds"
        # Optional, override the default metric prefix
        prefix = "pragmatik.collector"

        # Any key-value pairs to be tagged on every StatsD metric
        "tags": {
          "app": collector
        }
      }
    }
    akka {
{{/*      loglevel = DEBUG*/}}
      loglevel = WARNING
      loggers = ["akka.event.slf4j.Slf4jLogger"]
      http.server {
        remote-address-header = on
        raw-request-uri-header = on
        parsing {
          max-uri-length = 32768
          uri-parsing-mode = relaxed
        }
        max-connections = 2048
      }
    }
