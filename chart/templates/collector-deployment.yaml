apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector-server
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.collector.replicas }}
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
        checksum-config: {{ include (print $.Template.BasePath "/collector-cm.yaml") . | sha256sum | trimSuffix "-" | trunc 63 }}
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 10
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - collector
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: collector-server
          image: pragmatikai/scala-stream-collector-kafka:2.10.3
          command:
            - "/home/snowplow/bin/snowplow-stream-collector"
            - "--config"
            - "/snowplow/config/config.hocon"
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: JAVA_OPTS
              value: -Dorg.slf4j.simpleLogger.defaultLogLevel=info
          volumeMounts:
            - name: collector-config-volume
              mountPath: /snowplow/config
          resources:
            requests:
              memory: {{ .Values.collector.resources.requests.memory }}
              cpu: {{ .Values.collector.resources.requests.cpu }}
            limits:
              memory: {{ .Values.collector.resources.limits.memory }}
              cpu: {{ .Values.collector.resources.limits.cpu }}
      {{- if .Values.transformer.tolerations }}
      tolerations:
        {{- toYaml .Values.transformer.tolerations | nindent 8 }}
      {{- end }}
      volumes:
        - name: collector-config-volume
          configMap:
            name: collector-configmap
            items:
              - key: config.hocon
                path: config.hocon