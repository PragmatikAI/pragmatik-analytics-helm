apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: snowplow-collector
  namespace: {{ .Release.Namespace }}
  {{- if .Values.collector.ingress.annotations }}
  annotations:
   {{ toYaml .Values.collector.ingress.annotations | nindent 4 }}
  {{- end }}
spec:
  tls:
    {{- range .Values.collector.ingress.tls}}
    - hosts:
      {{- range .hosts }}
        - {{ . }}
      {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
      
  ingressClassName: {{ .Values.collector.ingress.className }}
  rules:
    {{- range .Values.collector.ingress.hosts }}
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: collector
                port:
                  number: 8080
    {{- end }}
