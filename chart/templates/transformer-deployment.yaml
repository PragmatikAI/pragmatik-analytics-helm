apiVersion: apps/v1
kind: Deployment
metadata:
  name: transformer-server
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.transformer.replicas }}
  selector:
    matchLabels:
      app: transformer
  template:
    metadata:
      labels:
        app: transformer
        checksum-config: {{ include (print $.Template.BasePath "/transformer-cm.yaml") . | sha256sum | trimSuffix "-" | trunc 63 }}
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 10
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - transformer
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: transformer-server
          image: {{ .Values.transformer.image }}
          imagePullPolicy: IfNotPresent

          volumeMounts:
            - name: transformer-config-volume
              mountPath: /pragmatik/config
          resources:
            requests:
              memory: {{ .Values.transformer.resources.requests.memory }}
              cpu: {{ .Values.transformer.resources.requests.cpu }}
            limits:
              memory: {{ .Values.transformer.resources.limits.memory }}
              cpu: {{ .Values.transformer.resources.limits.cpu }}
      volumes:
        - name: transformer-config-volume
          configMap:
            name: transformer-configmap
            items:
              - key: transformer-config.hocon
                path: transformer-config.hocon
              - key: iglu-config.json
                path: iglu-config.json
